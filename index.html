<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>랜덤 모둠 편성기</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 폰트: Pretendard -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', sans-serif;
            background-color: #f3f4f6; /* Tailwind gray-100 */
        }
        /* 페이드인 애니메이션 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8; 
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

    <!-- 헤더 -->
    <header class="mb-8 text-center">
        <h1 class="text-3xl md:text-4xl font-extrabold text-gray-800 mb-2 tracking-tight">🎲 랜덤 모둠 편성기</h1>
        <p class="text-gray-500">학급 학생들을 빠르고 공정하게 모둠으로 나눕니다.</p>
    </header>

    <!-- 컨트롤 패널 -->
    <main class="w-full max-w-4xl bg-white rounded-2xl shadow-lg p-6 md:p-8 mb-8">
        
        <!-- 커스텀 에러 메시지 표시 영역 -->
        <div id="errorMessage" class="hidden mb-4 p-4 bg-red-50 text-red-600 rounded-xl text-sm font-medium border border-red-200">
            <!-- 에러 내용이 여기에 들어갑니다 -->
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- 좌측: 학생 명단 입력 -->
            <div class="flex flex-col">
                <div class="flex justify-between items-end mb-2">
                    <label for="studentList" class="block text-sm font-semibold text-gray-700">학생 명단 (콤마로 구분)</label>
                    <div>
                        <input type="file" id="fileUpload" accept=".txt, .csv" class="hidden">
                        <label for="fileUpload" class="cursor-pointer text-xs bg-gray-100 hover:bg-indigo-50 text-gray-600 hover:text-indigo-600 font-semibold py-1.5 px-3 rounded-lg transition-colors border border-gray-200 hover:border-indigo-200 shadow-sm flex items-center gap-1">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                            </svg>
                            파일 업로드
                        </label>
                    </div>
                </div>
                <textarea id="studentList" rows="5" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all resize-none text-sm text-gray-700 leading-relaxed"></textarea>
                <div class="mt-2 text-xs text-gray-400 flex justify-between">
                    <span>* 실제 이름으로 수정하여 사용할 수 있습니다.</span>
                    <span id="studentCount" class="font-medium text-indigo-500">총 24명</span>
                </div>
            </div>

            <!-- 우측: 모둠 설정 및 버튼 -->
            <div class="flex flex-col justify-center">
                <label class="block text-sm font-semibold text-gray-700 mb-2">몇 모둠으로 나눌까요?</label>
                <div class="flex items-center gap-2 mb-6 w-full">
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="groupCount" value="3" class="peer hidden">
                        <div class="text-center py-3 rounded-xl border border-gray-300 bg-white text-gray-600 font-bold peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-600 transition-all hover:bg-gray-50">3모둠</div>
                    </label>
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="groupCount" value="4" class="peer hidden">
                        <div class="text-center py-3 rounded-xl border border-gray-300 bg-white text-gray-600 font-bold peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-600 transition-all hover:bg-gray-50">4모둠</div>
                    </label>
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="groupCount" value="5" class="peer hidden">
                        <div class="text-center py-3 rounded-xl border border-gray-300 bg-white text-gray-600 font-bold peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-600 transition-all hover:bg-gray-50">5모둠</div>
                    </label>
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="groupCount" value="6" class="peer hidden" checked>
                        <div class="text-center py-3 rounded-xl border border-gray-300 bg-white text-gray-600 font-bold peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-600 transition-all hover:bg-gray-50">6모둠</div>
                    </label>
                </div>
                
                <button id="generateBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-6 rounded-xl shadow-md hover:shadow-lg transition-all active:scale-[0.98] text-lg flex justify-center items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                    </svg>
                    편성하기
                </button>
            </div>
        </div>
    </main>

    <!-- 결과 표시 영역 -->
    <div id="resultsContainer" class="w-full max-w-5xl grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 pb-12">
        <!-- 결과 카드들이 여기에 생성됩니다 -->
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const studentListInput = document.getElementById('studentList');
            const generateBtn = document.getElementById('generateBtn');
            const resultsContainer = document.getElementById('resultsContainer');
            const errorMessage = document.getElementById('errorMessage');
            const studentCountDisplay = document.getElementById('studentCount');
            const fileUploadInput = document.getElementById('fileUpload');

            // 1~24번 기본 학생 목록 생성
            const defaultStudents = Array.from({ length: 24 }, (_, i) => `${i + 1}번`).join(', ');
            studentListInput.value = defaultStudents;

            // 모둠별 테마 색상 팔레트 (디자인 요소)
            const colorPalettes = [
                { cardBorder: 'border-red-400', titleText: 'text-red-600', deskBg: 'bg-red-200', deskBorder: 'border-red-300 border-b-red-500', deskText: 'text-red-900' },
                { cardBorder: 'border-orange-400', titleText: 'text-orange-600', deskBg: 'bg-orange-200', deskBorder: 'border-orange-300 border-b-orange-500', deskText: 'text-orange-900' },
                { cardBorder: 'border-amber-400', titleText: 'text-amber-600', deskBg: 'bg-amber-200', deskBorder: 'border-amber-300 border-b-amber-500', deskText: 'text-amber-900' },
                { cardBorder: 'border-green-400', titleText: 'text-green-600', deskBg: 'bg-green-200', deskBorder: 'border-green-300 border-b-green-500', deskText: 'text-green-900' },
                { cardBorder: 'border-emerald-400', titleText: 'text-emerald-600', deskBg: 'bg-emerald-200', deskBorder: 'border-emerald-300 border-b-emerald-500', deskText: 'text-emerald-900' },
                { cardBorder: 'border-teal-400', titleText: 'text-teal-600', deskBg: 'bg-teal-200', deskBorder: 'border-teal-300 border-b-teal-500', deskText: 'text-teal-900' },
                { cardBorder: 'border-cyan-400', titleText: 'text-cyan-600', deskBg: 'bg-cyan-200', deskBorder: 'border-cyan-300 border-b-cyan-500', deskText: 'text-cyan-900' },
                { cardBorder: 'border-blue-400', titleText: 'text-blue-600', deskBg: 'bg-blue-200', deskBorder: 'border-blue-300 border-b-blue-500', deskText: 'text-blue-900' },
                { cardBorder: 'border-indigo-400', titleText: 'text-indigo-600', deskBg: 'bg-indigo-200', deskBorder: 'border-indigo-300 border-b-indigo-500', deskText: 'text-indigo-900' },
                { cardBorder: 'border-violet-400', titleText: 'text-violet-600', deskBg: 'bg-violet-200', deskBorder: 'border-violet-300 border-b-violet-500', deskText: 'text-violet-900' },
                { cardBorder: 'border-purple-400', titleText: 'text-purple-600', deskBg: 'bg-purple-200', deskBorder: 'border-purple-300 border-b-purple-500', deskText: 'text-purple-900' },
                { cardBorder: 'border-fuchsia-400', titleText: 'text-fuchsia-600', deskBg: 'bg-fuchsia-200', deskBorder: 'border-fuchsia-300 border-b-fuchsia-500', deskText: 'text-fuchsia-900' },
                { cardBorder: 'border-pink-400', titleText: 'text-pink-600', deskBg: 'bg-pink-200', deskBorder: 'border-pink-300 border-b-pink-500', deskText: 'text-pink-900' },
                { cardBorder: 'border-rose-400', titleText: 'text-rose-600', deskBg: 'bg-rose-200', deskBorder: 'border-rose-300 border-b-rose-500', deskText: 'text-rose-900' }
            ];

            // 학생 수 업데이트 함수
            const updateStudentCount = () => {
                const students = getStudents();
                studentCountDisplay.textContent = `총 ${students.length}명`;
            };

            studentListInput.addEventListener('input', updateStudentCount);

            // 파일 업로드 처리
            fileUploadInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(event) {
                    const content = event.target.result;
                    // 줄바꿈(\n)이나 콤마(,)로 분리하고 공백 제거
                    const parsedStudents = content.split(/[\n,]+/)
                        .map(s => s.trim())
                        .filter(s => s.length > 0);
                    
                    if (parsedStudents.length > 0) {
                        studentListInput.value = parsedStudents.join(', ');
                        updateStudentCount();
                    } else {
                        showError('파일에서 학생 명단을 찾을 수 없습니다.');
                    }
                    
                    // 같은 파일을 다시 업로드해도 이벤트가 발생하도록 초기화
                    fileUploadInput.value = '';
                };
                
                reader.onerror = function() {
                    showError('파일을 읽는 중 오류가 발생했습니다.');
                };
                
                // 파일을 텍스트 형식으로 읽기
                reader.readAsText(file);
            });

            // 현재 텍스트상자의 학생 목록을 배열로 반환
            function getStudents() {
                const rawText = studentListInput.value;
                return rawText.split(',')
                              .map(s => s.trim())
                              .filter(s => s.length > 0);
            }

            // 배열을 무작위로 섞는 함수 (Fisher-Yates Shuffle)
            function shuffle(array) {
                const newArray = [...array];
                for (let i = newArray.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
                }
                return newArray;
            }

            // 에러 메시지 표시/숨김
            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.classList.remove('hidden');
                setTimeout(() => {
                    errorMessage.classList.add('hidden');
                }, 3000);
            }

            // 편성하기 버튼 클릭 이벤트
            generateBtn.addEventListener('click', () => {
                const students = getStudents();
                const checkedGroupOption = document.querySelector('input[name="groupCount"]:checked');
                const groupCount = checkedGroupOption ? parseInt(checkedGroupOption.value, 10) : 6;

                // 유효성 검사
                if (students.length === 0) {
                    showError('학생 명단이 비어있습니다. 학생을 입력해주세요.');
                    return;
                }
                if (isNaN(groupCount) || groupCount < 1) {
                    showError('모둠 수는 1 이상의 숫자여야 합니다.');
                    return;
                }
                if (groupCount > students.length) {
                    showError('모둠 수가 학생 수보다 많을 수 없습니다.');
                    return;
                }

                // 학생 무작위 섞기
                const shuffledStudents = shuffle(students);
                
                // 모둠 초기화 (빈 배열 k개 생성)
                const groups = Array.from({ length: groupCount }, () => []);

                // 균등 배정 (순서대로 하나씩 분배)
                // 남는 학생이 생겨도 앞에서부터 1명씩 추가 배정되므로 자동으로 균등해집니다.
                shuffledStudents.forEach((student, index) => {
                    groups[index % groupCount].push(student);
                });

                // 결과 화면 렌더링
                renderGroups(groups);
            });

            // 결과 HTML 생성 및 화면 표시
            function renderGroups(groups) {
                // 기존 결과 지우기
                resultsContainer.innerHTML = '';
                
                // 컬러 팔레트도 섞어서 매번 다른 느낌을 줌
                const shuffledPalettes = shuffle(colorPalettes);

                groups.forEach((group, index) => {
                    const palette = shuffledPalettes[index % shuffledPalettes.length];
                    const delay = index * 0.05; // 순차적 페이드인 효과를 위한 딜레이

                    const card = document.createElement('div');
                    card.className = `bg-white rounded-2xl shadow-sm border-t-4 ${palette.cardBorder} p-5 flex flex-col fade-in`;
                    card.style.animationDelay = `${delay}s`;
                    card.style.opacity = '0'; // 애니메이션 시작 전 숨김

                    const header = document.createElement('div');
                    header.className = 'flex justify-between items-center mb-4 pb-3 border-b border-gray-100';
                    
                    const title = document.createElement('h3');
                    title.className = `text-lg font-bold ${palette.titleText}`;
                    title.textContent = `${index + 1} 모둠`;
                    
                    const countBadge = document.createElement('span');
                    countBadge.className = 'px-2 py-1 bg-gray-100 text-gray-500 text-xs font-semibold rounded-full';
                    countBadge.textContent = `${group.length}명`;

                    header.appendChild(title);
                    header.appendChild(countBadge);
                    card.appendChild(header);

                    // --- [수정된 부분] 텍스트 목록 대신 책상 그래픽(UI)을 그리드로 배치 ---
                    
                    // 책상 배치를 위한 그룹 바닥(매트) 영역
                    const groupFloor = document.createElement('div');
                    // 인원이 7명 이상이면 3열, 보통은 2열(마주보는 구조)로 설정
                    const gridClass = group.length >= 7 ? 'grid-cols-3' : 'grid-cols-2';
                    groupFloor.className = `flex-grow grid ${gridClass} gap-x-5 gap-y-4 bg-slate-50 p-5 rounded-2xl border border-slate-100`;

                    group.forEach((student, sIndex) => {
                        // 개별 책상+의자 래퍼
                        const deskArea = document.createElement('div');
                        deskArea.className = 'relative flex items-center justify-center w-full h-12 md:h-14';

                        // 의자 생성 (UI) - 책상 밑에 깔리도록 z-index 0
                        const chair = document.createElement('div');
                        chair.className = 'absolute bg-slate-300 border border-slate-400 rounded-full shadow-sm z-0';
                        
                        if (gridClass === 'grid-cols-2') {
                            // 2열 배치: 바깥쪽에 의자를 두어 가운데를 서로 마주보게(모둠 활동 형태) 설정
                            chair.classList.add('w-4', 'h-8', 'top-1/2', '-translate-y-1/2');
                            if (sIndex % 2 === 0) {
                                chair.classList.add('-left-2'); // 왼쪽 줄은 의자가 바깥쪽(왼쪽)에
                            } else {
                                chair.classList.add('-right-2'); // 오른쪽 줄은 의자가 바깥쪽(오른쪽)에
                            }
                        } else {
                            // 3열 배치: 모든 의자가 아래를 향하도록 설정
                            chair.classList.add('h-4', 'w-8', 'left-1/2', '-translate-x-1/2', '-bottom-2');
                        }

                        // 책상 생성 (UI) - z-index 10으로 의자 위로 올라옴
                        const desk = document.createElement('div');
                        // 모둠 테마 색상에 맞춘 배경색상 및 입체감(border-b-4) 부여
                        desk.className = `w-full h-full ${palette.deskBg} border ${palette.deskBorder} border-b-4 rounded-lg shadow-sm flex items-center justify-center ${palette.deskText} font-bold text-sm md:text-base z-10 relative px-1 overflow-hidden`;
                        
                        // 학생 이름 텍스트 (말줄임표 적용)
                        const nameSpan = document.createElement('span');
                        nameSpan.className = 'truncate px-1';
                        nameSpan.textContent = student;
                        
                        desk.appendChild(nameSpan);
                        deskArea.appendChild(chair);
                        deskArea.appendChild(desk);
                        groupFloor.appendChild(deskArea);
                    });

                    card.appendChild(groupFloor);
                    // --------------------------------------------------------

                    resultsContainer.appendChild(card);
                });
            }
        });
    </script>
</body>
</html>
